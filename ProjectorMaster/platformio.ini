; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:master]
platform = atmelsam
board = adafruit_feather_m4
framework = arduino

lib_extra_dirs = ../lib
lib_deps =
    SystemShared
    https://github.com/adafruit/Adafruit_SleepyDog.git
    https://github.com/adafruit/Adafruit-GFX-Library.git
    https://github.com/adafruit/Adafruit_SSD1306.git
    https://github.com/adafruit/Adafruit_SPIFlash.git
    sandeepmistry/CAN
lib_ldf_mode = deep+

; Exclude legacy test files from normal build
build_src_filter = +<*> -<mainOLDTEST.cpp>

; Build flags to ensure I2C and high-speed PWM work correctly
build_flags =
    -D ARDUINO_SAMD_FEATHER_M4
    -I include/state
    -I include/drivers
    -I include/util

; Force a specific COM port if auto upload fails
; upload_port = COM4
; monitor_port = COM4