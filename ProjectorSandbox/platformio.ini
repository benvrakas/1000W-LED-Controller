; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:sandbox]
platform = atmelsam
board = adafruit_feather_m4
framework = arduino

lib_extra_dirs = ../lib
lib_deps = 
    SystemShared
    https://github.com/adafruit/Adafruit_SleepyDog.git
    https://github.com/adafruit/Adafruit-GFX-Library.git
    https://github.com/adafruit/Adafruit_SSD1306.git

lib_ldf_mode = deep+

; Point Compiler to the Master source and header files
build_flags =
    -I ../ProjectorSandbox/include/diagnoseDrivers
    -I ../ProjectorSandbox/src/diagnoseSystemState
    -D ARDUINO_SAMD_FEATHER_M4
    -D CORE_CONTROLLER_ONLY

build_src_filter = 
    +<*.cpp> ; Include everything in the Sandbox src
    +<../ProjectorSandbox/src/diagnoseDrivers/*.cpp> ; Include all test files in the diagnoseDrivers folder
    -<../ProjectorMaster/src/diagnoseSystemState/*.cpp> ; Include all test files in the Master diagnoseSystemState folder

; Force a specific COM port if auto upload fails
; upload_port = COM4
; monitor_port = COM4


