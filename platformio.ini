; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_m4]
platform = atmelsam
board = adafruit_feather_m4
framework = arduino

; Library dependencies - PlatformIO will download these automatically on build
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.16.2
    Wire
    SPI

; Build flags to ensure I2C and high-speed PWM work correctly
build_flags =
    -D ARDUINO_SAMD_FEATHER_M4

; Force a specific COM port if auto upload fails
; upload_port = COM4
; monitor_port = COM4