; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:master]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    https://github.com/adafruit/Adafruit_SleepyDog.git
    https://github.com/adafruit/Adafruit-GFX-Library.git
    https://github.com/adafruit/Adafruit_SH110X.git
    https://github.com/adafruit/Adafruit_BusIO.git
    adafruit/CAN Adafruit Fork
lib_ldf_mode = deep+

; Build flags to ensure I2C and high-speed PWM work correctly
build_flags =
    -D ADAFRUIT_FEATHER_M4_CAN
    -I include/state
    -I include/drivers
    -I include/util
;   Uncomment to trace every cooling channel (duty / RPM / windowed RPM /
;   raw pulses / stall flag, plus the aux PWM pin's PMUXEN bit) through boot
;   steps 2-3 and the first 8s of RUN. Diagnostic only -- compiles to nothing
;   when commented out. See include/util/CoolingBootTrace.h.
    -D COOLING_BOOT_TRACE

; Exclude bench-test-only firmware (see [env:bench_test]) from the real build
build_src_filter = +<*> -<bench/>

; Force a specific COM port if auto upload fails
; upload_port = COM4
; monitor_port = COM4
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Standalone bench-test firmware: drives the PC-pin RC filter (AnalogPsuBackend)
; directly from serial commands, bypassing SystemController/arm sequence, so the
; filter's DC output can be probed with a multimeter over USB power alone.
; Flash with:   pio run -e bench_test -t upload
; Then return to the real firmware with: pio run -e master -t upload
; ---------------------------------------------------------------------------
[env:bench_test]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino
build_src_filter = -<*> +<drivers/AnalogPsuBackend.cpp> +<bench/PcFilterBenchTest.cpp>
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Standalone bench-test firmware: drives the aux/lens fan's PWM output (D4)
; and reads its tach input (D13) directly from serial commands, bypassing
; SystemController/CoolingService/FaultManager and the arm sequence, so the
; signal can be probed at the MCU pin, at isolator U6, and at the fan
; connector without any ERROR_KILL latch interrupting the test.
; Flash with:   pio run -e aux_fan_bench -t upload
; Then return to the real firmware with: pio run -e master -t upload
; ---------------------------------------------------------------------------
[env:aux_fan_bench]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino
build_src_filter = -<*> +<bench/AuxFanBenchTest.cpp>
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Standalone bench-test firmware: isolates the pulse-counting path for all
; four tach channels (pump, main, PSU, aux) from the rest of the state
; machine -- no PWM output, no SystemController/FaultManager/CoolingService/
; UiController, nothing but pin config + attachInterrupt + a once-a-second
; pulse-count printout. For diagnosing a "0 RPM everywhere, even hand-spun"
; regression that survived a full code review of the state-machine path and
; an independent hardware check (isolators, header-to-board signal path).
; Flash with:   pio run -e all_tach_bench -t upload
; Then return to the real firmware with: pio run -e master -t upload
; ---------------------------------------------------------------------------
[env:all_tach_bench]
platform = atmelsam
board = adafruit_feather_m4_can
framework = arduino
build_src_filter = -<*> +<bench/AllTachBenchTest.cpp>
monitor_speed = 115200